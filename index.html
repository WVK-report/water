<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>월드비전 식수사업</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f2f2f2; }
    iframe { border: none; width: 100%; height: 100%; }
    .loading-text { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: sans-serif; color: #888; z-index: -1; 
    }
  </style>
</head>
<body>
  <div class="loading-text">리포트를 불러오는 중입니다...</div>
  <iframe id="reportFrame" src="" allow="web-share"></iframe>

  <script>
    const googleWebAppUrl = "https://script.google.com/macros/s/AKfycbzRTagwyX7l-m8Y-02yXkohMh6P39jVcyruLKdBFwhlJ7n4Kg0F9wI6Vbgvy0TF3TnZNA/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const donationId = urlParams.get('id');
    const reportFrame = document.getElementById('reportFrame');

    if (donationId) {
      const timestamp = new Date().getTime();
      reportFrame.src = googleWebAppUrl + "?id=" + donationId + "&cachebust=" + timestamp;
    } else {
      document.body.innerHTML = "<div style='text-align:center; margin-top:50px;'><h1>잘못된 접근입니다.</h1><p>후원자 ID가 확인되지 않습니다.</p></div>";
    }

    // GAS(iframe)로부터 오는 메시지 수신
    window.addEventListener('message', function(e) {
      // 보안을 위해 특정 도메인만 허용하려면 e.origin 체크를 추가할 수 있습니다.
      const data = e.data;
      
      if (data.type === 'SHARE') {
        fnParentShare(data.title, data.text, data.url);
      } else if (data.type === 'COPY') {
        fnParentCopy(data.url);
      }
    });

    async function fnParentShare(title, text, url) {
      if (navigator.share) {
        try {
          await navigator.share({ title: title, text: text, url: url });
        } catch (err) { console.log('공유 취소'); }
      } else {
        fnParentCopy(url);
      }
    }

    function fnParentCopy(url) {
      const t = document.createElement("textarea");
      document.body.appendChild(t);
      t.value = url;
      t.select();
      document.execCommand("copy");
      document.body.removeChild(t);
      alert("리포트 주소가 복사되었습니다!");
    }
  </script>
</body>
</html>
